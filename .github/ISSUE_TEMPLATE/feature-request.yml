name: Feature request
description: Suggest an idea or new functionality for Prospera
title: "[Feature] "
labels: ["enhancement"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to suggest a feature. Please fill out the details below.

    - type: textarea
      id: problem
      attributes:
          label: Problem / motivation
          description: What are you trying to achieve? What is missing or painful today?
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          description: What would you like to happen? Be as concrete as possible (screenshots/mockups welcome).
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Any alternative solutions or workarounds you have considered.
      validations:
          required: false

    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - Frontend (UI)
              - Frontend (JS)
              - Backend (PHP)
              - CI / tooling
              - Other
      validations:
          required: true

    - type: textarea
      id: context
      attributes:
          label: Additional context
      validations:
          required: false
